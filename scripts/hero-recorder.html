<!doctype html><meta charset="utf-8"><title>rec2</title>
<canvas id="c" width="1280" height="720"></canvas>
<pre id="log"></pre>
<script>
addEventListener('error', (e) => { document.title = 'ERR:' + (e.message || 'unknown'); });
const W = 1280, H = 720, DUR = 8000, FPS = 30, TAU = Math.PI * 2;
const c = document.getElementById('c'), ctx = c.getContext('2d', { alpha: false });
const log = (m) => { document.getElementById('log').textContent += m + '\n'; };
const rnd = (seed) => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; };

/* ---- static base layer rendered once ---- */
const base = document.createElement('canvas');
base.width = Math.round(W * 1.08); base.height = Math.round(H * 1.08);
const bx = base.getContext('2d', { alpha: false });
(function paintBase() {
  const BW = base.width, BH = base.height;
  const sky = bx.createLinearGradient(0, 0, 0, BH);
  sky.addColorStop(0, '#08080c'); sky.addColorStop(0.45, '#0b0d13'); sky.addColorStop(1, '#050507');
  bx.fillStyle = sky; bx.fillRect(0, 0, BW, BH);

  const gx = BW * 0.74, gy = BH * 0.19;
  const glow = bx.createRadialGradient(gx, gy, 0, gx, gy, BW * 0.62);
  glow.addColorStop(0, 'rgba(206,168,96,0.32)');
  glow.addColorStop(0.42, 'rgba(150,116,60,0.10)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  bx.fillStyle = glow; bx.fillRect(0, 0, BW, BH);

  const hz = bx.createRadialGradient(BW * 0.18, BH * 0.3, 0, BW * 0.18, BH * 0.3, BW * 0.5);
  hz.addColorStop(0, 'rgba(96,120,160,0.16)'); hz.addColorStop(1, 'rgba(0,0,0,0)');
  bx.fillStyle = hz; bx.fillRect(0, 0, BW, BH);

  const ridge = (y0, amp, freq, phase, color) => {
    bx.beginPath(); bx.moveTo(-40, BH);
    for (let x = -40; x <= BW + 40; x += 10) {
      const t = x / BW;
      const y = y0 + Math.sin(t * freq * TAU + phase) * amp + Math.sin(t * freq * 2.7 * TAU + phase * 1.7) * amp * 0.42;
      bx.lineTo(x, y);
    }
    bx.lineTo(BW + 40, BH); bx.closePath(); bx.fillStyle = color; bx.fill();
  };
  ridge(BH * 0.70, BH * 0.035, 1, 0.4, '#0a0b10');
  ridge(BH * 0.78, BH * 0.028, 1.6, 1.9, '#07080c');
  ridge(BH * 0.88, BH * 0.020, 2.3, 3.4, '#050507');

  const vig = bx.createRadialGradient(BW / 2, BH * 0.46, BH * 0.28, BW / 2, BH * 0.5, BH * 0.95);
  vig.addColorStop(0, 'rgba(5,5,7,0)');
  vig.addColorStop(0.72, 'rgba(5,5,7,0.42)');
  vig.addColorStop(1, 'rgba(5,5,7,0.95)');
  bx.fillStyle = vig; bx.fillRect(0, 0, BW, BH);
})();

const motes = Array.from({ length: 110 }, (_, i) => {
  const r = rnd(i + 7);
  return { x: r() * W, y: r() * H, s: 0.6 + r() * 1.5, v: 8 + r() * 20, a: 0.05 + r() * 0.3, ph: r() * TAU };
});

function drawFrame(t) {
  const push = 1 + 0.05 * t;
  const bw = base.width, bh = base.height;
  const sw = bw / push, sh = bh / push;
  ctx.drawImage(base, (bw - sw) / 2, (bh - sh) / 2, sw, sh, 0, 0, W, H);

  // one breathing warm glow
  const ga = 0.05 * Math.sin(t * TAU);
  if (ga > 0.001) {
    const g = ctx.createRadialGradient(W * 0.74, H * 0.19, 0, W * 0.74, H * 0.19, W * 0.5);
    g.addColorStop(0, 'rgba(206,168,96,' + ga + ')');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }

  // drifting mist band
  const mx = W * (0.5 + 0.14 * Math.sin(t * TAU));
  const m = ctx.createRadialGradient(mx, H * 0.66, 0, mx, H * 0.66, W * 0.5);
  m.addColorStop(0, 'rgba(186,196,210,0.05)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = m; ctx.fillRect(0, 0, W, H);

  // motes
  for (const p of motes) {
    let y = (p.y - p.v * t) % H; if (y < 0) y += H;
    const tw = 0.6 + 0.4 * Math.sin(t * TAU * 2 + p.ph);
    ctx.fillStyle = 'rgba(226,210,180,' + (p.a * tw) + ')';
    ctx.fillRect(p.x + Math.sin(t * TAU + p.ph) * 10, y, p.s, p.s);
  }

  // grain
  for (let i = 0; i < 220; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (Math.random() * 0.028) + ')';
    ctx.fillRect(Math.random() * W, Math.random() * H, 1.3, 1.3);
  }
}

window.__start = () => {
  drawFrame(0);
  const preferWebm = location.search.includes('webm');
  const types = preferWebm
    ? ['video/webm;codecs=vp9', 'video/webm']
    : ['video/mp4;codecs=avc1.42E01E', 'video/webm;codecs=vp9', 'video/webm'];
  const mime = types.find((x) => MediaRecorder.isTypeSupported(x));
  const stream = c.captureStream(FPS);
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    document.title = 'DONE:' + mime + ':' + Math.round(blob.size / 1024);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = mime.includes('mp4') ? 'hero.mp4' : 'hero.webm';
    a.id = 'dl'; document.body.appendChild(a); a.click();
  };
  rec.start();
  const t0 = performance.now();
  let frames = 0;
  let nextFrame = 0;
  const tick = () => {
    const el = performance.now() - t0;
    // pace canvas updates to a real 30 fps so the container timing stays correct
    if (el * FPS / 1000 >= nextFrame) {
      nextFrame++;
      drawFrame(Math.min(el / DUR, 1));
      frames++;
    }
    if (el < DUR) requestAnimationFrame(tick);
    else {
      log('frames=' + frames + ' fps=' + (frames / (el / 1000)).toFixed(1));
      rec.stop();
    }
  };
  requestAnimationFrame(tick);
};
</script>
